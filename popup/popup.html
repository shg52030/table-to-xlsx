<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>网页表格导出 Excel</title>
  </head>
  <body>
    <div class="hd">
      <span class="logo">XLS</span>
      <div>
        <h1>网页表格导出 Excel</h1>
        <p>纯本地处理，不上传任何数据</p>
      </div>
    </div>

    <button id="open" class="primary">打开导出面板</button>
    <button id="all" class="ghost">导出本页全部表格</button>

    <p class="hint">页面右下角的 <b>XLS</b> 按钮也能打开面板。</p>
    <p id="msg" class="msg"></p>

    <script src="popup.js"></script>
  </body>
</html>
