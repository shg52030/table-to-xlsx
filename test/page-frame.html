<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>iframe 场景测试</title>
    <style>
      body { font: 13px/1.6 "Microsoft YaHei", sans-serif; padding: 24px 32px; color: #1f2937; }
      table { border-collapse: collapse; margin: 8px 0 20px; }
      td, th { border: 1px solid #cbd5e1; padding: 5px 12px; }
      iframe { width: 100%; height: 420px; border: 1px solid #cbd5e1; }

  </head>
  <body>
    <h2>主框架表格</h2>

      <tr><th>编号</th><th>名称</th></tr>
      <tr><td>1</td><td>主框架行</td></tr>
    </table>

    <h2>iframe 内嵌表格</h2>
    <iframe src="page.html"></iframe>
  </body>
</html>
